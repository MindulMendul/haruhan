name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile to run"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - development

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g eas-cli@22.6.0

      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-release.keystore.jks

      # eas-cli는 credentials.json 안의 $VAR 같은 환경 변수 치환 문법을 지원하지
      # 않는다(공식 문서에 CI용으로는 실제 값이 채워진 credentials.json 전체를
      # base64로 인코딩해서 쓰라고 되어 있음). 그래서 값을 그대로 파일에 박아넣는
      # 대신, 시크릿을 여기서 keytool로 먼저 검증해 빠르게 실패하도록 한다.
      - name: Verify keystore credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android-release.keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      # credentials.json 자체는 실제 비밀값이 든 파일이라 레포에 커밋하지 않고
      # (.gitignore 대상), 빌드 직전에 시크릿 값으로 직접 생성한다.
      - name: Generate EAS local credentials file
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jq -n \
            --arg keystorePassword "$ANDROID_KEYSTORE_PASSWORD" \
            --arg keyAlias "$ANDROID_KEY_ALIAS" \
            --arg keyPassword "$ANDROID_KEY_PASSWORD" \
            '{android: {keystore: {keystorePath: "android-release.keystore.jks", keystorePassword: $keystorePassword, keyAlias: $keyAlias, keyPassword: $keyPassword}}}' \
            > credentials.json

      - name: Run EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build -p android --profile ${{ inputs.profile }} --non-interactive --wait

      - name: Clean up keystore
        if: always()
        run: rm -f android-release.keystore.jks credentials.json
